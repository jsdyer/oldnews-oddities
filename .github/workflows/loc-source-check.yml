name: Verify deployed CoolCode Halifax newspaper search
on:
  push:
    branches: [diagnose/loc-source-headers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the public Worker with the production site origin
        run: python3 scripts/check_halifax_source.py
